[project]
name = "water-quality-prediction-api"
version = "1.0.0"
description = "FastAPI backend for water quality predictions"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "numpy==1.24.3",
    "pandas==2.1.3",
    "scikit-learn==1.3.2",
    "requests==2.31.0",
    "python-dateutil==2.8.2",
    "python-multipart==0.0.6",
    "aiohttp==3.9.1",
    "httpx==0.25.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
